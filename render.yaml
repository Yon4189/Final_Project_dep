services:
  # 1. Laravel Backend
  - type: web
    name: final-project-backend
    runtime: php
    plan: free
    rootDir: backend
    buildCommand: ./render-build.sh
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: final-project-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: final-project-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: final-project-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: final-project-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: final-project-db
          property: password

databases:
  - name: final-project-db
    plan: free
